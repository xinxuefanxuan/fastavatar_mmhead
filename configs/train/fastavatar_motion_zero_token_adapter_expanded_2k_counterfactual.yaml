experiment:
    type: fastavatar
    seed: 42
    parent: fastavatar
    child: fastavatar_motion_zero_token_adapter_expanded_2k_counterfactual

model:
    pretrained_model_path: "./model_zoo/fastavatar/model.safetensors"

    # image encoder
    encoder_path: "./model_zoo/DINO/dinov2.safetensors"
    source_image_res: 128
    encoder_grad_ckpt: true
    encoder_model_name: "dinov2_vitl14_reg"
    encoder_feat_dim: 1024
    encoder_freeze: true

    # points embeddings
    pcl_dim: 1024

    # transformer
    num_base_frames: 16
    if_framepack: true
    framepack_compression_level: 8  # [2, 4, 8]
    transformer_dim: 1024
    context_attn_layers: 8
    transformer_layers: 10
    transformer_heads: 16
    tf_grad_ckpt: true
    aa_order: ["global", "frame"]

    # for gs renderer
    renderer_freeze: false
    human_model_path: "./model_zoo/human_parametric_models"
    flame_subdivide_num: 1
    gs_query_dim: 1024
    gs_use_rgb: true
    gs_sh: 3
    gs_mlp_network_config:
        n_neurons: 512
        n_hidden_layers: 2
        activation: "silu"
    gs_xyz_offset_max_step: 0.2
    gs_clip_scaling: 0.01
    scale_sphere: false
    add_teeth: true
    fix_opacity: false
    fix_rotation: false
    teeth_bs_flag: false
    oral_mesh_flag: true
    gs_pruning: true
    rendering_chunk_size_train: 1
    rendering_chunk_size_infer: 8
    debug_max_query_points: null
    debug_skip_renderer: false
    debug_latent_smoke_loss: false

    # P9.1 optional MotionTokenAdapter (disabled by default; preserves baseline behavior)
    use_motion_token: true
    motion_token_input_dim: 96
    motion_token_hidden_dim: null
    motion_token_mode: "add_query"
    motion_token_scale: 1.0
    zero_flame_motion: true
    freeze_backbone_for_motion_token: true
    motion_token_source: "frame_flame_gt"
    motion_token_norm_stats: "outputs/mmhead_debug/motion_dataset_v1_ae_debug/norm_stats.json"
    motion_token_expr_dim: 50
    motion_token_pad_to_dim: 96
    motion_token_train_adapter_only_strict: true
    motion_token_counterfactual_training: true

dataset:
    input_frames: 8
    target_frames: 1
    render_image_res: 128
    source_image_res: 128
    num_train_workers: 0
    num_val_workers: 0
    pin_mem: true
    val_num: 0
    multiply: 2
    # Multiple datasets config
    meta_path: "./outputs/mmhead_debug/p9_2j_counterfactual_metadata/p9_2j_expanded_2k_counterfactual_mixed_uids.json"
    datasets:
        nersemble:
            root_dir: "./data/nersemble_fastavatar_unified_full"
            task_type: "unified"
            val_id: ["083"] # Sacrificial validation ID excluded from adapter-training metadata
        # vfhq:
        #     root_dir: "./data/nersemble_fastavatar_unified_full"
        #     task_type: "monocular"
        #     val_id: [] # '98tIutcmLfo', '2Bw4XUWgx6U', 'NoCALyAt1Os', 'LANE2TzVuLQ', 'JV5Z6eltAw'

train:
    gradient_checkpointing: true
    find_unused_parameters: true
    loss:
        pixel_loss_type: "l1"
        pixel_weight: 1.0
        perceptual_weight: 0.0
        ssim_weight: 0.0
        offset_weight: 0.0
        tracking_weight: 0.0
        pruning_weight: 0.0
        identity_weight: 0.0
        arcface_checkpoint: "./model_zoo/arcface/arcface_checkpoint.tar"
    optim:
        lr: 5e-5
        heads_lr_scale: 5
        weight_decay: 0.001
        beta1: 0.9
        beta2: 0.95
        clip_grad_norm: 0
    scheduler:
        type: cosine
        warmup_real_iters: 0
    batch_size: 1
    accum_steps: 1
    epochs: 1000
    debug_global_steps: 2000
    counterfactual:
        enabled: true
        margin: 0.01
        alpha: 0.2
        beta: 0.1
        wrong_token_mode: "shuffle_batch"
        zero_token: true
        detach_negative_losses: false
    resume: ""

val:
    batch_size: 1
    global_step_period: 999999
    skip_eval: true
    debug_batches: null
    save_images: false
    save_dir: "./exps/val_perf"
    samples_per_save: 1

saver:
    auto_resume: false
    load_model: null
    checkpoint_root: "./exps/checkpoints"
    checkpoint_global_steps: 2000
    checkpoint_keep_level: 3

logger:
    stream_level: INFO
    log_level: INFO
    log_root: "./exps/logs"
    tracker_root: "./exps/trackers"
    enable_profiler: false
    trackers:
        - tensorboard

compile:
    suppress_errors: true
    print_specializations: true
    disable: true